name: Build & Release

# Genera los binarios para Windows, macOS y Linux (Debian-based).
# - Al empujar un tag `v*` (p. ej. `v0.1.0`) publica un GitHub Release con los instaladores.
# - También se puede lanzar manualmente desde la pestaña Actions para obtener artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder detecta el SO del runner y produce sus targets:
      # Windows -> nsis + portable, macOS -> dmg + zip, Linux -> AppImage + deb.
      # Sin GH_TOKEN aquí a propósito: solo compila; la publicación la hace el job `release`.
      - name: Build distributables
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrtourbuilder-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # Publica un GitHub Release con todos los binarios cuando se empuja un tag v*.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
